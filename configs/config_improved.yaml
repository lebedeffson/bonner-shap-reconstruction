dataset:
  train_data: normalized_linear_data_with_q_500K.csv
  validation_data: normalized_data_with_q_375.csv
  normalize_sum: true
  mix_with_real: true
  mix_ratio: 0.01  # УВЕЛИЧЕНО: было 0.002, теперь 0.01 (в 5 раз больше реальных данных)
  test_size: 0.25
  random_state: 42
model:
  # УВЕЛИЧЕННАЯ ЕМКОСТЬ МОДЕЛИ для лучшего обучения
  num_rules: 20  # УВЕЛИЧЕНО: было 12, теперь 20 для большей емкости
  mf_class: Gaussian
  vanishing_strategy: blend
  optim: OriginalPSO
  reg_lambda: 0.1  # УМЕНЬШЕНО: было 0.2, теперь 0.1 (меньше регуляризации, больше свободы)
  seed: 42
  n_workers: 4
  optim_params:
    epoch: 25  # УВЕЛИЧЕНО: было 15, теперь 25 для лучшей PSO инициализации
    pop_size: 50  # УВЕЛИЧЕНО: было 30, теперь 50 для лучшего поиска в PSO
    verbose: false
shap_reg:
  enabled: true
  # ОПТИМИЗАЦИЯ ДЛЯ МАКСИМАЛЬНОЙ ТОЧНОСТИ С УЧЕТОМ ДИАГНОСТИКИ
  integrated_training: true  # Интегрированный режим для лучшей сходимости
  use_gpu: true  # ЯВНО ВКЛЮЧАЕМ GPU
  
  # БАЛАНС МЕЖДУ ТОЧНОСТЬЮ И ИНТЕРПРЕТИРУЕМОСТЬЮ
  gamma: 0.3  # УВЕЛИЧЕНО: было 0.1, теперь 0.3 (больше влияния SHAP для интерпретируемости)
  epochs: 200  # УВЕЛИЧЕНО: было 150, теперь 200 для лучшей сходимости на большом датасете
  batch_size: 64  # УВЕЛИЧЕНО: было 32, теперь 64 для стабильности градиентов
  lr: 0.005  # УВЕЛИЧЕНО: было 0.003, теперь 0.005 для более быстрого обучения
  train_samples: 100000  # УВЕЛИЧЕНО: было 60000, теперь 100000 для большего охвата данных
  grad_clip: 1.0
  
  # Режим обучения - используем full_fast для большего количества данных
  training_mode: full_fast  # ИЗМЕНЕНО: full_fast для большего количества данных (375K синтетических + реальные)
  
  # Улучшенная SHAP регуляризация с адаптацией к точности
  use_improved_shap: true
  use_true_shap: true
  true_shap_update_frequency: 20  # УВЕЛИЧЕНО: было 10, теперь 20 (реже обновляем для скорости)
  
  # PSO инициализация - УСИЛЕНА для лучшего старта
  use_pso_init: true
  pso_epochs: 20  # УВЕЛИЧЕНО: было 10, теперь 20 для лучшей инициализации
  
  # Адаптивная нормализация SHAP loss - БАЛАНС
  target_shap_ratio: 0.2  # УВЕЛИЧЕНО: было 0.1, теперь 0.2 (больше влияния SHAP)
  
  # Адаптивный gamma schedule - плавное увеличение
  use_adaptive_gamma: true
  gamma_start: 0.1  # УВЕЛИЧЕНО: было 0.01, теперь 0.1 (больше влияния с начала)
  gamma_end: 0.4  # УВЕЛИЧЕНО: было 0.2, теперь 0.4 (больше влияния в конце)
  gamma_warmup_epochs: 0.3  # УМЕНЬШЕНО: было 0.5, теперь 0.3 (быстрее включаем SHAP)
  
  # Плавная сходимость
  use_convergence_smoothing: true
  convergence_patience: 15  # УВЕЛИЧЕНО: было 10, теперь 15 (больше терпения)
  
  # Адаптивные веса компонентов - БАЛАНС
  use_adaptive_weights: true
  
  # Улучшенная Sparsity - УМЕРЕННОЕ влияние
  use_gini_sparsity: true
  target_gini: 0.3  # ВОССТАНОВЛЕНО: было 0.2, теперь 0.3 (умеренная интерпретируемость)
  
  # Компоненты SHAP регуляризации - БАЛАНС между точностью и интерпретируемостью
output:
  results_dir: results
  save_model: true
  save_predictions: true
  save_plots: true
  save_samples: true
  sample_size: 5

