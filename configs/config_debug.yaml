dataset:
  train_data: normalized_linear_data_with_q_500K.csv
  validation_data: normalized_data_with_q_375.csv
  normalize_sum: true
  mix_with_real: false
  mix_ratio: 0.0
  test_size: 0.5
  random_state: 42
  train_limit: 10000
  train_sample_strategy: head
model:
  num_rules: 7
  mf_class: Gaussian
  vanishing_strategy: blend
  optim: OriginalPSO
  reg_lambda: 0.1
  seed: 42
  n_workers: 2
  optim_params:
    epoch: 15
    pop_size: 20
    verbose: false
shap_reg:
  enabled: true
  gamma: 0.5
  epochs: 10
  batch_size: 32
  lr: 0.003
  train_samples: 4000
  grad_clip: 1.0
output:
  results_dir: results_debug
  save_model: true
  save_predictions: true
  save_samples: true
  sample_size: 5

