dataset:
  train_data: normalized_data_with_q_375.csv
  validation_data: normalized_data_with_q_375.csv
  normalize_sum: true
  mix_with_real: false
  mix_ratio: 0.0
  test_size: 0.2
  random_state: 42
  feature_prefix: "Q"
  feature_count: 10
  feature_index_start: 1
  target_prefix: ""
  target_count: 60
  target_index_start: 1

model:
  num_rules: 50
  mf_class: Gaussian
  vanishing_strategy: blend
  optim: OriginalPSO
  reg_lambda: 0.001
  seed: 42
  n_workers: 4
  optim_params:
    epoch: 150
    pop_size: 100
    verbose: false

shap_reg:
  enabled: true
  integrated_training: false
  training_mode: real_only
  use_pso_init: false
  pso_epochs: 150
  epochs: 220
  batch_size: 32
  lr: 0.001

  # Сильный и контролируемый SHAP-сигнал (без схлопывания в шум)
  gamma: 0.12
  gamma_start: 0.02
  gamma_end: 0.12
  gamma_warmup_epochs: 0.45
  use_adaptive_gamma: true

  # target_shap_ratio теперь управляет финальным вкладом gamma*SHAP/main
  target_shap_ratio: 0.22
  min_shap_ratio: 0.15
  max_shap_ratio: 0.40
  min_scale_factor: 0.35
  max_scale_factor: 10.0
  min_convergence_slowdown: 0.20

  use_adaptive_weights: true
  use_true_shap: true
  true_shap_update_frequency: 6
  true_shap_samples_per_batch: 3

  shap_estimator: exact_shap
  strict_exact_shap: true
  max_exact_features: 12
  mc_permutations: 256

  active_components: [consistency, sparsity, faithfulness, stability]
  use_improved_shap: true
  gamma_consistency: 0.25
  gamma_sparsity: 0.45
  gamma_faithfulness: 0.20
  gamma_stability: 0.10

  # Floor для адаптивных весов, чтобы важные компоненты не обнулялись
  min_weight_consistency: 0.15
  min_weight_sparsity: 0.15
  min_weight_faithfulness: 0.10
  min_weight_stability: 0.08

  # Тихонов оставляем мягким, чтобы не подавлять SHAP-вклад
  tikhonov:
    enabled: true
    lambda: 0.0003
    order: 2

output:
  results_dir: results
  save_model: true
  save_predictions: true
  save_plots: true
  save_samples: true
  sample_size: 5
