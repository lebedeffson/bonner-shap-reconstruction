dataset:
  train_data: normalized_data_with_q_375.csv
  validation_data: normalized_data_with_q_375.csv
  normalize_sum: true
  mix_with_real: false
  mix_ratio: 0.0
  test_size: 0.2
  random_state: 42
  # Гибкая настройка колонок
  # Признаки (детекторы)
  feature_prefix: "Q"
  feature_count: 10
  feature_index_start: 1
  # Целевые значения (спектр)
  target_prefix: ""
  target_count: 60
  target_index_start: 1

model:
  num_rules: 50
  mf_class: Gaussian # Используем Gaussian для стабильности и дифференцируемости
  vanishing_strategy: blend
  optim: OriginalPSO # Основной оптимизатор для структуры
  reg_lambda: 0.001
  seed: 42
  n_workers: 4
  optim_params:
    epoch: 150 
    pop_size: 100
    verbose: false

shap_reg:
  enabled: true
  # ГИБРИДНЫЙ РЕЖИМ (Hybrid Two-Stage XAI):
  # 1. Сначала запускается Vanilla PSO (внешний вызов) -> R2 ~ 0.85
  # 2. Затем запускается SHAP Fine-tuning (300 эпох) -> R2 ~ 0.84 + Объяснимость
  # integrated_training: false переключает train.py в этот надежный режим.
  integrated_training: false 
  training_mode: real_only
  
  # Параметры встроенной инициализации (не используются в Hybrid режиме, но оставим для истории)
  use_pso_init: false
  pso_epochs: 150
  
  epochs: 300 # 300 эпох тонкой настройки с SHAP
  batch_size: 32
  lr: 0.001
  
  # SHAP параметры - усиленный режим после абляционного анализа
  gamma: 0.10
  gamma_start: 0.02
  gamma_end: 0.10
  gamma_warmup_epochs: 0.5
  
  use_adaptive_gamma: true
  target_shap_ratio: 0.40
  min_convergence_slowdown: 0.25
  use_adaptive_weights: true
  use_true_shap: true
  # Полная SHAP-регуляризация (exact SHAP для d=10)
  shap_estimator: exact_shap
  strict_exact_shap: true
  max_exact_features: 12
  mc_permutations: 256
  active_components: [consistency, sparsity, faithfulness, stability]
  
  # Улучшенная регуляризация (Consistency, Sparsity, Faithfulness, Stability)
  # При use_adaptive_weights=false эти коэффициенты используются как фиксированные веса компонентов.
  use_improved_shap: true
  gamma_sparsity: 0.7
  gamma_consistency: 0.2
  gamma_faithfulness: 0.05
  gamma_stability: 0.05

  # Тихоновская регуляризация (гладкость спектра)
  tikhonov:
    enabled: true
    lambda: 0.002
    order: 2

output:
  results_dir: results
  save_model: true
  save_predictions: true
  save_plots: true
  save_samples: true
  sample_size: 5
