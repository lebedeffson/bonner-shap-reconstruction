dataset:
  train_data: normalized_data_with_q_375.csv
  validation_data: normalized_data_with_q_375.csv
  normalize_sum: true
  mix_with_real: false
  mix_ratio: 0.0
  test_size: 0.2
  random_state: 42

model:
  num_rules: 50
  mf_class: Gaussian # Используем Gaussian для стабильности и дифференцируемости
  vanishing_strategy: blend
  optim: OriginalPSO # Основной оптимизатор для структуры (Global Search)
  reg_lambda: 0.001
  seed: 42
  n_workers: 4
  optim_params:
    epoch: 150 # 150 эпох PSO для нахождения глобального минимума
    pop_size: 100
    verbose: false

shap_reg:
  enabled: true
  # ИСПОЛЬЗУЕМ ГИБРИДНУЮ СТРАТЕГИЮ (Two-Stage):
  # 1. Обучение структуры через PSO (Vanilla) -> R² ~ 0.84
  # 2. Fine-tuning с SHAP регуляризацией (Gradient Descent) -> Улучшение интерпретируемости
  # Это дает лучшие результаты, чем обучение с нуля (integrated_training: true)
  integrated_training: false 
  training_mode: real_only
  
  epochs: 300 # Длительная тонкая настройка с SHAP
  batch_size: 32
  lr: 0.001
  
  # SHAP параметры - мягкий старт
  gamma: 0.05
  gamma_start: 0.0
  gamma_end: 0.05
  gamma_warmup_epochs: 0.5
  
  use_adaptive_gamma: true
  
  # Улучшенная регуляризация (Consistency, Sparsity, Faithfulness, Stability)
  use_improved_shap: true
  gamma_sparsity: 0.7
  gamma_consistency: 0.2
  gamma_faithfulness: 0.05
  gamma_stability: 0.05
