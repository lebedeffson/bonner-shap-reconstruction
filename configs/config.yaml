dataset:
  train_data: normalized_linear_data_with_q_500K.csv
  validation_data: normalized_data_with_q_375.csv
  normalize_sum: true
  mix_with_real: true
  mix_ratio: 0.002  # доля реальных данных (0.2%)
  test_size: 0.25
  random_state: 42
model:
  num_rules: 7
  mf_class: Gaussian
  vanishing_strategy: blend
  optim: OriginalPSO
  reg_lambda: 0.3
  seed: 42
  n_workers: 4
  optim_params:
    epoch: 15
    pop_size: 30
    verbose: false
shap_reg:
  enabled: true
  gamma: 0.5
  epochs: 25
  batch_size: 32
  lr: 0.003
  train_samples: 60000
  grad_clip: 1.0
output:
  results_dir: results
  save_model: true
  save_predictions: true
  save_plots: true
  save_samples: true
  sample_size: 5
