dataset:
  train_data: normalized_data_with_q_375.csv
  validation_data: normalized_data_with_q_375.csv
  normalize_sum: true
  mix_with_real: false
  mix_ratio: 0.0
  test_size: 0.25
  random_state: 42

model:
  num_rules: 50
  mf_class: GBell
  vanishing_strategy: blend
  optim: OriginalPSO
  reg_lambda: 0.001
  seed: 42
  n_workers: 4
  optim_params:
    epoch: 150
    pop_size: 200
    verbose: false

shap_reg:
  enabled: true
  integrated_training: false  # Двухэтапное обучение
  training_mode: real_only    # Используем реальные данные
  
  gamma: 0.1  # ФИКСИРОВАНО: 0.1 (консервативно)
  epochs: 25
  batch_size: 32
  lr: 0.002
  train_samples: null
  grad_clip: 1.0
  
  use_improved_shap: true
  
  # ОТКЛЮЧЕНА АДАПТИВНОСТЬ
  use_adaptive_gamma: false
  # gamma_start: 0.05 # Не используется
  # gamma_end: 0.2    # Не используется
  # gamma_warmup_epochs: 0.3 # Не используется
  
  use_convergence_smoothing: false
  # convergence_patience: 10 # Не используется
  
  use_adaptive_weights: false
  use_gini_sparsity: true
  target_gini: 0.3
  target_shap_ratio: 0.15
  
  negative_penalty: 0.1
  use_gpu: true

output:
  results_dir: results
  save_model: true
  save_predictions: true
  save_plots: true
  save_samples: true
  sample_size: 5
